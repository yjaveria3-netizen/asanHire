<svg xmlns="http://www.w3.org/2000/svg" width="206" height="180" viewBox="26 40 206 180" role="img" aria-label="asanHire mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>asanHire</title>
  <defs>
    <!-- knockout: hides the letters under the arrow outline so the "a" stays readable -->
    <mask id="ko" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <path transform="translate(92 204) rotate(20)" d="M -5.5 0 L 5.5 0 L 5.5 -122 L 19 -122 L 0 -160 L -19 -122 L -5.5 -122 Z" fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g mask="url(#ko)">
    <!-- letter a: single-story, bowl + stem -->
    <circle cx="80" cy="142" r="32" fill="none" stroke="#D9DADF" stroke-width="18"/>
    <line x1="112" y1="101" x2="112" y2="183" stroke="#D9DADF" stroke-width="18"/>
    <!-- letter H: two bars + crossbar -->
    <line x1="164" y1="78" x2="164" y2="183" stroke="#D9DADF" stroke-width="18"/>
    <line x1="206" y1="78" x2="206" y2="183" stroke="#D9DADF" stroke-width="18"/>
    <line x1="164" y1="131" x2="206" y2="131" stroke="#D9DADF" stroke-width="18"/>
  </g>
  <!-- arrow -->
  <path transform="translate(92 204) rotate(20)" d="M -5.5 0 L 5.5 0 L 5.5 -122 L 19 -122 L 0 -160 L -19 -122 L -5.5 -122 Z" fill="#DD700B" filter="url(#glow)"/>
</svg>
